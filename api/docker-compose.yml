services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: agrichain
      POSTGRES_PASSWORD: agrichain
      POSTGRES_DB: agrichain
    ports:
      - "5432:5432"
    volumes:
      - agrichain_pg:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/00_schema.sql:ro

  cache:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://agrichain:agrichain@db:5432/agrichain
      REDIS_URL: redis://cache:6379/0
    depends_on:
      - db
      - cache
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

volumes:
  agrichain_pg:
