<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="Fresh ginger rhizome with green shoots">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8CF94"/>
      <stop offset="0.5" stop-color="#C99E68"/>
      <stop offset="1" stop-color="#A97E4C"/>
    </linearGradient>
    <linearGradient id="snip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4E0AC"/>
      <stop offset="1" stop-color="#E3C077"/>
    </linearGradient>
    <linearGradient id="shoot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#74C69D"/>
      <stop offset="1" stop-color="#2D6A4F"/>
    </linearGradient>
  </defs>

  <ellipse cx="400" cy="356" rx="200" ry="15" fill="#4E2E0F" opacity="0.14"/>

  <!-- main rhizome mass -->
  <g transform="translate(430,252)">
    <path d="M-150,40 C -168,8 -160,-30 -132,-44 C -112,-20 -112,16 -122,44 Z" fill="url(#skin)" opacity="0.85"/>
    <path d="M-90,52 C -104,14 -98,-30 -70,-44 C -54,-16 -54,22 -64,52 Z" fill="url(#skin)"/>
    <path d="M-20,60 C -34,16 -26,-32 2,-46 C 20,-14 20,28 10,60 Z" fill="url(#skin)"/>
    <path d="M50,56 C 38,12 44,-30 72,-42 C 90,-12 88,28 78,56 Z" fill="url(#skin)" opacity="0.92"/>
    <path d="M120,44 C 132,10 128,-22 102,-34 C 84,-4 86,28 92,48 Z" fill="url(#skin)" opacity="0.8"/>
    <path d="M-150,40 C -120,64 -70,78 -16,76 C 30,74 78,66 92,48 C 96,84 56,104 4,104 C -56,104 -128,88 -150,40 Z" fill="url(#skin)"/>
  </g>

  <!-- broken / cut ends with paler core -->
  <g>
    <ellipse cx="296" cy="268" rx="16" ry="34" fill="url(#snip)" transform="rotate(-14 296 268)"/>
    <ellipse cx="330" cy="312" rx="14" ry="28" fill="url(#snip)" transform="rotate(20 330 312)"/>
  </g>

  <!-- sprouting shoots -->
  <g stroke="url(#shoot)" stroke-linecap="round" fill="none">
    <path d="M388,206 C 384,176 392,150 412,124" stroke-width="11"/>
    <path d="M418,196 C 422,168 414,142 394,120" stroke-width="10" opacity="0.9"/>
    <path d="M440,212 C 452,186 448,160 428,136" stroke-width="9" opacity="0.85"/>
  </g>
  <g>
    <path d="M412,124 C 424,116 438,122 434,136 C 424,142 416,134 412,124 Z" fill="url(#shoot)" transform="rotate(24 423 130)"/>
    <path d="M394,120 C 382,112 370,120 374,134 C 384,140 392,130 394,120 Z" fill="url(#shoot)" transform="rotate(-26 382 126)"/>
    <path d="M428,136 C 440,130 452,138 446,150 C 436,154 430,146 428,136 Z" fill="url(#shoot)" transform="rotate(30 439 142)"/>
  </g>

  <!-- highlight -->
  <path d="M300,256 C 342,246 396,248 432,262" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.28"/>
</svg>