<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="Steaming cup of Assam tea with fresh leaves">
  <defs>
    <linearGradient id="cup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E7DFD2"/>
    </linearGradient>
    <linearGradient id="tea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D08A3C"/>
      <stop offset="1" stop-color="#7C4A1D"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#74C69D"/>
      <stop offset="1" stop-color="#1B4332"/>
    </linearGradient>
    <linearGradient id="saucer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4EBDC"/>
      <stop offset="1" stop-color="#D9CBB4"/>
    </linearGradient>
  </defs>

  <ellipse cx="400" cy="356" rx="190" ry="15" fill="#4E2E0F" opacity="0.14"/>

  <!-- steam -->
  <g stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.75">
    <path d="M360,196 C 352,182 366,174 360,160 C 354,146 368,138 362,124"/>
    <path d="M404,196 C 396,180 410,172 404,158 C 398,144 412,136 406,120"/>
    <path d="M442,200 C 436,188 448,180 442,168 C 436,156 448,148 442,136"/>
  </g>

  <!-- tea sprig behind -->
  <g>
    <path d="M520,120 C 470,150 442,200 430,262" stroke="url(#leaf)" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M452,170 C 486,158 504,168 500,186 C 480,192 456,184 452,170 Z" fill="url(#leaf)" transform="rotate(-8 476 176)"/>
    <path d="M444,206 C 478,196 496,208 492,226 C 472,232 448,222 444,206 Z" fill="url(#leaf)" transform="rotate(-6 468 214)"/>
    <path d="M438,244 C 470,238 486,250 482,266 C 462,272 440,262 438,244 Z" fill="url(#leaf)" transform="rotate(-4 460 252)"/>
    <path d="M514,132 C 546,122 560,134 554,152 C 534,158 516,148 514,132 Z" fill="url(#leaf)" transform="rotate(10 534 140)"/>
  </g>

  <!-- saucer -->
  <ellipse cx="400" cy="326" rx="150" ry="26" fill="url(#saucer)"/>
  <ellipse cx="400" cy="322" rx="118" ry="18" fill="#EFE5D2" opacity="0.6"/>

  <!-- cup -->
  <path d="M292,148 C 292,244 340,286 400,286 C 460,286 508,244 508,148 Z" fill="url(#cup)"/>
  <path d="M508,166 C 552,168 560,196 548,214 C 536,232 506,232 506,208" stroke="url(#cup)" stroke-width="16" stroke-linecap="round" fill="none"/>
  <!-- tea surface -->
  <ellipse cx="400" cy="150" rx="104" ry="22" fill="url(#tea)"/>
  <ellipse cx="400" cy="172" rx="108" ry="24" fill="url(#tea)" opacity="0.9"/>
  <!-- cup band + imprint -->
  <path d="M316,238 C 350,262 450,262 484,238" stroke="#C9B896" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M356,206 C 372,202 392,202 408,206 L 402,222 C 392,224 376,224 366,220 Z" fill="#2D6A4F" opacity="0.85"/>
  <ellipse cx="368" cy="152" rx="22" ry="7" fill="#FFFFFF" opacity="0.5"/>
</svg>