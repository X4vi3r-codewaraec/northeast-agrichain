<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="Golden aromatic rice panicles">
  <defs>
    <linearGradient id="grain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7D174"/>
      <stop offset="1" stop-color="#D99A2E"/>
    </linearGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7BAE7F"/>
      <stop offset="1" stop-color="#4A7A55"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#74C69D"/>
      <stop offset="1" stop-color="#2D6A4F"/>
    </linearGradient>
  </defs>

  <ellipse cx="400" cy="360" rx="190" ry="14" fill="#7A4312" opacity="0.15"/>

  <!-- centre panicle: drooping grain head -->
  <g transform="translate(420,60)">
    <path d="M0,0 C 4,90 0,180 -30,280" stroke="url(#stem)" stroke-width="7" stroke-linecap="round" fill="none"/>
    <!-- grains along the droop -->
    <g fill="url(#grain)">
      <ellipse cx="6" cy="46" rx="5" ry="11" transform="rotate(-14 6 46)"/>
      <ellipse cx="2" cy="74" rx="5" ry="11" transform="rotate(-10 2 74)"/>
      <ellipse cx="0" cy="102" rx="5" ry="11" transform="rotate(-6 0 102)"/>
      <ellipse cx="-4" cy="130" rx="5" ry="11" transform="rotate(-2 -4 130)"/>
      <ellipse cx="-10" cy="158" rx="5" ry="11" transform="rotate(4 -10 158)"/>
      <ellipse cx="-18" cy="186" rx="5" ry="11" transform="rotate(10 -18 186)"/>
      <ellipse cx="-28" cy="212" rx="5" ry="11" transform="rotate(16 -28 212)"/>
      <ellipse cx="-40" cy="236" rx="5" ry="11" transform="rotate(20 -40 236)"/>
      <ellipse cx="14" cy="92" rx="5" ry="11" transform="rotate(-18 14 92)"/>
      <ellipse cx="12" cy="140" rx="5" ry="11" transform="rotate(-10 12 140)"/>
      <ellipse cx="2" cy="188" rx="5" ry="11" transform="rotate(-4 2 188)"/>
      <ellipse cx="-14" cy="232" rx="5" ry="11" transform="rotate(12 -14 232)"/>
    </g>
  </g>

  <!-- left panicle -->
  <g transform="translate(286,96) rotate(-8)">
    <path d="M0,0 C -4,80 6,150 30,228" stroke="url(#stem)" stroke-width="6" stroke-linecap="round" fill="none"/>
    <g fill="url(#grain)" opacity="0.92">
      <ellipse cx="-6" cy="48" rx="4.5" ry="10" transform="rotate(-12 -6 48)"/>
      <ellipse cx="-8" cy="82" rx="4.5" ry="10" transform="rotate(-8 -8 82)"/>
      <ellipse cx="-6" cy="116" rx="4.5" ry="10" transform="rotate(-3 -6 116)"/>
      <ellipse cx="-2" cy="150" rx="4.5" ry="10" transform="rotate(4 -2 150)"/>
      <ellipse cx="4" cy="182" rx="4.5" ry="10" transform="rotate(11 4 182)"/>
      <ellipse cx="12" cy="210" rx="4.5" ry="10" transform="rotate(17 12 210)"/>
      <ellipse cx="4" cy="96" rx="4.5" ry="10" transform="rotate(-20 4 96)"/>
    </g>
  </g>

  <!-- right panicle -->
  <g transform="translate(520,90) rotate(7)">
    <path d="M0,0 C 2,84 -4,158 -28,236" stroke="url(#stem)" stroke-width="6" stroke-linecap="round" fill="none"/>
    <g fill="url(#grain)" opacity="0.92">
      <ellipse cx="4" cy="52" rx="4.5" ry="10" transform="rotate(14 4 52)"/>
      <ellipse cx="6" cy="86" rx="4.5" ry="10" transform="rotate(8 6 86)"/>
      <ellipse cx="2" cy="120" rx="4.5" ry="10" transform="rotate(2 2 120)"/>
      <ellipse cx="-4" cy="154" rx="4.5" ry="10" transform="rotate(-5 -4 154)"/>
      <ellipse cx="-12" cy="188" rx="4.5" ry="10" transform="rotate(-12 -12 188)"/>
      <ellipse cx="-22" cy="216" rx="4.5" ry="10" transform="rotate(-18 -22 216)"/>
      <ellipse cx="-8" cy="100" rx="4.5" ry="10" transform="rotate(20 -8 100)"/>
    </g>
  </g>

  <!-- rice leaves at base -->
  <path d="M300,330 C 250,320 214,296 196,264 C 240,286 292,308 300,330 Z" fill="url(#leaf)"/>
  <path d="M500,330 C 556,318 596,292 612,258 C 566,284 512,308 500,330 Z" fill="url(#leaf)"/>
  <path d="M380,344 C 360,364 330,372 306,366 C 334,360 366,352 380,344 Z" fill="url(#leaf)"/>
</svg>