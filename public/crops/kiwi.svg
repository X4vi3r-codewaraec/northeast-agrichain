<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="Kiwi fruit, halved and whole">
  <defs>
    <linearGradient id="flesh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8FD66F"/>
      <stop offset="0.6" stop-color="#5CB85C"/>
      <stop offset="1" stop-color="#3E9B4B"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9A6B33"/>
      <stop offset="1" stop-color="#6F4A1E"/>
    </linearGradient>
  </defs>

  <ellipse cx="400" cy="356" rx="200" ry="15" fill="#4A2E0E" opacity="0.15"/>

  <!-- halved kiwi (front) -->
  <g transform="translate(330,268)">
    <circle r="86" fill="url(#flesh)"/>
    <circle r="86" fill="none" stroke="#6F4A1E" stroke-width="8"/>
    <circle r="62" fill="url(#flesh)" opacity="0.35"/>
    <circle r="14" fill="#F2ECD8"/>
    <circle r="7" fill="#D8CD9E"/>
    <!-- seed ring -->
    <g fill="#241505">
      <ellipse rx="3.2" ry="4" transform="rotate(0) translate(14 0)"/>
      <ellipse rx="3.2" ry="4" transform="rotate(24) translate(14 0)"/>
      <ellipse rx="3.2" ry="4" transform="rotate(48) translate(14 0)"/>
      <ellipse rx="3.2" ry="4" transform="rotate(72) translate(14 0)"/>
      <ellipse rx="3.2" ry="4" transform="rotate(96) translate(14 0)"/>
      <ellipse rx="3.2" ry="4" transform="rotate(120) translate(14 0)"/>
      <ellipse rx="3.2" ry="4" transform="rotate(144) translate(14 0)"/>
      <ellipse rx="3.2" ry="4" transform="rotate(168) translate(14 0)"/>
      <ellipse rx="3.2" ry="4" transform="rotate(192) translate(14 0)"/>
      <ellipse rx="3.2" ry="4" transform="rotate(216) translate(14 0)"/>
      <ellipse rx="3.2" ry="4" transform="rotate(240) translate(14 0)"/>
      <ellipse rx="3.2" ry="4" transform="rotate(264) translate(14 0)"/>
      <ellipse rx="3.2" ry="4" transform="rotate(288) translate(14 0)"/>
      <ellipse rx="3.2" ry="4" transform="rotate(312) translate(14 0)"/>
      <ellipse rx="3.2" ry="4" transform="rotate(336) translate(14 0)"/>
    </g>
    <!-- radial pale rays -->
    <g stroke="#FFFFFF" stroke-width="2" opacity="0.25" fill="none">
      <path d="M-70,0 L-52,0 M0,-70 L0,-52 M70,0 L52,0 M0,70 L0,52 M-49,-49 L-37,-37 M49,-49 L37,-37 M49,49 L37,37 M-49,49 L-37,37"/>
    </g>
    <ellipse cx="-30" cy="-40" rx="16" ry="12" fill="#FFFFFF" opacity="0.35" transform="rotate(-30 -30 -40)"/>
  </g>

  <!-- whole kiwi (behind right) -->
  <g transform="translate(532,250) rotate(18)">
    <ellipse rx="92" ry="66" fill="url(#skin)"/>
    <g stroke="#B98A46" stroke-width="1.6" opacity="0.7" fill="none">
      <path d="M-78,10 C -40,24 52,22 82,4"/>
      <path d="M-84,-6 C -36,10 48,8 86,-8"/>
      <path d="M-80,-22 C -40,-8 46,-10 82,-22"/>
      <path d="M-70,-38 C -36,-26 46,-28 74,-38"/>
    </g>
    <ellipse cx="-24" cy="-30" rx="16" ry="11" fill="#FFFFFF" opacity="0.28" transform="rotate(-40 -24 -30)"/>
  </g>
</svg>