<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="Orange turmeric rhizomes">
  <defs>
    <linearGradient id="root" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7A93B"/>
      <stop offset="0.6" stop-color="#E8892B"/>
      <stop offset="1" stop-color="#C96A1D"/>
    </linearGradient>
    <linearGradient id="root2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC15A"/>
      <stop offset="1" stop-color="#D97B24"/>
    </linearGradient>
    <linearGradient id="slice" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC15A"/>
      <stop offset="1" stop-color="#E8892B"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#52B788"/>
      <stop offset="1" stop-color="#1B4332"/>
    </linearGradient>
  </defs>

  <ellipse cx="400" cy="352" rx="190" ry="16" fill="#7A4312" opacity="0.15"/>

  <!-- long green leaf behind -->
  <g transform="translate(320,180) rotate(-24)">
    <path d="M0,0 C 40,-14 120,-16 190,6 C 120,26 44,26 0,0 Z" fill="url(#leaf)" opacity="0.9"/>
    <path d="M0,0 C 60,-8 130,-8 184,6" stroke="#1B4332" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5"/>
  </g>

  <!-- main rhizome cluster: knobby fingers fanning up -->
  <g transform="translate(450,220)">
    <!-- back fingers -->
    <path d="M-120,42 C -138,10 -128,-30 -104,-46 C -86,-22 -84,18 -92,44 Z" fill="url(#root2)" opacity="0.85"/>
    <path d="M-52,58 C -66,18 -58,-28 -36,-42 C -22,-14 -22,28 -30,56 Z" fill="url(#root)" opacity="0.9"/>
    <!-- front fingers -->
    <path d="M-88,50 C -104,16 -92,-26 -66,-40 C -50,-14 -52,26 -62,52 Z" fill="url(#root)"/>
    <path d="M-2,64 C -14,20 -4,-30 20,-44 C 36,-12 36,28 26,62 Z" fill="url(#root2)"/>
    <path d="M-46,44 C -8,28 22,38 44,60 C 22,92 -24,94 -46,44 Z" fill="url(#root)"/>
    <!-- index-finger joints -->
    <path d="M-66,-40 C -78,-52 -70,-66 -56,-66" stroke="url(#root2)" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M20,-44 C 10,-60 20,-74 34,-72" stroke="url(#root)" stroke-width="12" stroke-linecap="round" fill="none"/>
  </g>

  <!-- sliced disc showing deep orange core -->
  <g transform="translate(225,240)">
    <circle r="52" fill="url(#slice)"/>
    <circle r="38" fill="#D97B24" opacity="0.55"/>
    <circle r="24" fill="#C96A1D" opacity="0.5"/>
    <path d="M-42,10 A48,48 0 0 1 30,-30" stroke="#FFE0A3" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.6"/>
    <ellipse cx="-16" cy="-14" rx="7" ry="10" fill="#FFFFFF" opacity="0.28" transform="rotate(-24 -16 -14)"/>
  </g>

  <!-- small ground leaves -->
  <g transform="translate(330,330) rotate(16)">
    <path d="M0,0 C 44,6 84,4 118,-10 C 78,22 36,24 0,0 Z" fill="url(#leaf)"/>
  </g>
</svg>